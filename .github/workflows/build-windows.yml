name: Build Windows app

# Run this manually from the "Actions" tab on GitHub (no Wine needed - this
# builds on a real Windows machine provided by GitHub, for free).
on:
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Package the Windows app (with icon)
        run: npm run package:win:icon

      - name: Zip the build
        run: Compress-Archive -Path "dist/Schedar-win32-x64" -DestinationPath "dist/Schedar-win32-x64.zip"
        shell: pwsh

      - name: Upload the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Schedar-win32-x64
          path: dist/Schedar-win32-x64.zip
